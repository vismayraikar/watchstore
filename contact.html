<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Contact - WatchStore</title>


<style>

/* =========================
   RESET
========================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    font-family: Arial, sans-serif;

}


/* =========================
   BODY
========================= */

body {

    background: #f5f5f5;

    min-height: 100vh;

}


/* =========================
   NAVBAR
========================= */

.navbar {

    background: #111;

    color: white;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 18px 60px;

}


/* LOGO */

.logo {

    display: flex;

    align-items: center;

    gap: 10px;

}


.logo span {

    font-size: 30px;

}


.logo h2 {

    font-size: 20px;

}


/* NAV LINKS */

.nav-links {

    display: flex;

    list-style: none;

    gap: 35px;

}


.nav-links a {

    color: white;

    text-decoration: none;

    font-size: 17px;

    transition: .3s;

}


.nav-links a:hover {

    color: gold;

}


/* CART */

.cart {

    font-size: 18px;

}


/* =========================
   CONTACT CONTAINER
========================= */

.container {

    width: 500px;

    max-width: 90%;

    margin: 60px auto;

    background: white;

    padding: 30px;

    border-radius: 10px;

    box-shadow:
        0 5px 15px
        rgba(0, 0, 0, .2);

}


.container h1 {

    text-align: center;

    margin-bottom: 10px;

}


.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 20px;

}


/* =========================
   INPUTS
========================= */

input,
textarea {

    width: 100%;

    padding: 12px;

    margin: 10px 0;

    border: 1px solid #ccc;

    border-radius: 5px;

    font-size: 16px;

}


input:focus,
textarea:focus {

    outline: none;

    border-color: gold;

}


textarea {

    resize: none;

}


/* =========================
   BUTTON
========================= */

button {

    width: 100%;

    background: black;

    color: white;

    padding: 12px;

    border: none;

    border-radius: 5px;

    cursor: pointer;

    font-size: 16px;

    margin-top: 10px;

    transition: .3s;

}


button:hover {

    background: gold;

    color: black;

}


button:disabled {

    background: #777;

    cursor: not-allowed;

}


/* =========================
   STATUS MESSAGE
========================= */

#status {

    text-align: center;

    margin-top: 15px;

    font-size: 16px;

    font-weight: bold;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .navbar {

        padding: 15px;

        flex-direction: column;

        gap: 15px;

    }


    .nav-links {

        gap: 15px;

        flex-wrap: wrap;

        justify-content: center;

    }


    .cart {

        display: none;

    }


    .container {

        margin: 30px auto;

        padding: 25px;

    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">


    <div class="logo">

        <span>⌚</span>

        <h2>WatchStore</h2>

    </div>


    <ul class="nav-links">


        <li>

            <a href="index.html">
                Home
            </a>

        </li>


        <li>

            <a href="collections.html">
                Collections
            </a>

        </li>


        <li>

            <a href="about.html">
                About
            </a>

        </li>


        <li>

            <a href="contact.html">
                Contact
            </a>

        </li>


    </ul>


    <div class="cart">

        🛒 Cart:

        <span id="cart-count">
            0
        </span>

    </div>


</nav>



<!-- =========================
     CONTACT FORM
========================= -->

<div class="container">


    <h1>
        Contact Us
    </h1>


    <p class="subtitle">

        Have a question?
        Send us a message.

    </p>


    <form id="contactForm">


        <!-- NAME -->

        <input
            type="text"
            name="name"
            id="name"
            placeholder="Your Name"
            required
        >


        <!-- EMAIL -->

        <input
            type="email"
            name="email"
            id="email"
            placeholder="Your Email"
            required
        >


        <!-- MESSAGE -->

        <textarea
            name="message"
            id="message"
            rows="6"
            placeholder="Your Message"
            required
        ></textarea>


        <!-- BUTTON -->

        <button
            type="submit"
            id="submitButton"
        >

            Send Message

        </button>


    </form>


    <!-- STATUS -->

    <div id="status"></div>


</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/*
================================================
GOOGLE APPS SCRIPT URL
================================================
*/

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzVnuzAAScTiS8y1qgpGVRcvDkXJ-pFPdKfO21n59fS-AA4d0QG_Au2mdPjo5T1Hs9G_A/exec";



/*
================================================
GET FORM
================================================
*/

const form =
    document.getElementById("contactForm");


const button =
    document.getElementById("submitButton");


const status =
    document.getElementById("status");



/*
================================================
FORM SUBMIT
================================================
*/

form.addEventListener(
    "submit",
    async function(event) {


        // Stop page refresh

        event.preventDefault();



        /*
        ========================================
        SHOW SENDING
        ========================================
        */

        button.disabled = true;

        button.innerText =
            "Sending...";

        status.innerText =
            "Please wait...";

        status.style.color =
            "#555";



        /*
        ========================================
        GET FORM DATA
        ========================================
        */

        const formData =
            new FormData(form);



        /*
        ========================================
        SEND TO GOOGLE APPS SCRIPT
        ========================================
        */

        try {


            await fetch(
                SCRIPT_URL,
                {

                    method: "POST",

                    body: formData,

                    mode: "no-cors"

                }
            );



            /*
            ====================================
            SUCCESS
            ====================================
            */

            status.innerText =
                "✓ Message sent successfully!";

            status.style.color =
                "green";


            /*
            ====================================
            CLEAR FORM
            ====================================
            */

            form.reset();


        }


        catch (error) {


            /*
            ====================================
            ERROR
            ====================================
            */

            console.error(
                "Error:",
                error
            );


            status.innerText =
                "✗ Failed to send message. Please try again.";

            status.style.color =
                "red";

        }



        /*
        ========================================
        ENABLE BUTTON
        ========================================
        */

        button.disabled = false;

        button.innerText =
            "Send Message";


    }

);

</script>


</body>

</html>
