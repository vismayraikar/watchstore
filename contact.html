<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - WatchStore</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

/* Navbar */

.navbar{
    background:#111;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 60px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo span{
    font-size:30px;
}

.logo h2{
    font-size:20px;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:35px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:17px;
    transition:.3s;
}

.nav-links a:hover{
    color:gold;
}

.cart{
    font-size:18px;
}

/* Contact Form */

.container{
    width:500px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 10px rgba(0,0,0,.2);
}

.container h1{
    text-align:center;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    background:black;
    color:white;
    padding:12px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

button:hover{
    background:gold;
    color:black;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar">

    <div class="logo">
        <span>⌚</span>
        <h2>WatchStore</h2>
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="collections.html">Collections</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="cart">
        🛒 Cart:
        <span id="cart-count">0</span>
    </div>

</nav>

<!-- Contact Form -->

<div class="container">

    <h1>Contact Us</h1>

    <form id="contactForm">

        <input type="text" placeholder="Your Name" required>

        <input type="email" placeholder="Your Email" required>

        <textarea rows="5" placeholder="Your Message" required></textarea>

        <button type="submit">Send Message</button>

    </form>

</div>

<script>

document.getElementById("contactForm").addEventListener("submit", function(e){

    e.preventDefault();

    alert("Thank you! Your message has been sent.");

    this.reset();

});

</script>

</body>
</html>
