<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Watch Store</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

/* Navbar */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 60px;
    background:#111;
    color:white;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo span{
    font-size:30px;
}

.logo h2{
    font-size:22px;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:35px;
}

.nav-links li{
    list-style:none;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:17px;
    transition:.3s;
}

.nav-links a:hover{
    color:gold;
}

.cart{
    font-size:18px;
}

/* Hero Section */

.hero{
    height:70vh;
    background:url("https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=1600") center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hero-content{
    background:rgba(0,0,0,.6);
    color:white;
    text-align:center;
    padding:40px;
    border-radius:10px;
}

.hero-content h1{
    font-size:45px;
    margin-bottom:15px;
}

.hero-content p{
    font-size:20px;
    margin-bottom:20px;
}

.shop-btn{
    display:inline-block;
    padding:12px 30px;
    background:gold;
    color:black;
    text-decoration:none;
    border-radius:5px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.shop-btn:hover{
    background:white;
    color:black;
}

/* Products */

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:30px;
    padding:50px;
}

.card{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:8px;
}

.card h3{
    margin:15px 0;
}

.card p{
    font-size:22px;
    font-weight:bold;
    color:#444;
}

.card button{
    margin-top:15px;
    padding:10px 20px;
    background:#111;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    transition:.3s;
}

.card button:hover{
    background:gold;
    color:black;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar">

    <div class="logo">
        <span>⌚</span>
        <h2>WatchStore</h2>
    </div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="collections.html">Collections</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="cart">
        🛒 Cart: <span id="cart-count">0</span>
    </div>

</nav>

<!-- Hero Section -->

<section class="hero">

    <div class="hero-content">
        <h1>Luxury Watches</h1>
        <p>Discover timeless elegance with premium watches.</p>

        <a href="collections.html" class="shop-btn">
            Shop Now
        </a>

    </div>

</section>

<!-- Featured Products -->

<section class="products">

    <div class="card">
        <img src="photo-1547996160-81dfa63595aa.jpg" alt="">
        <h3>Rolex Explorer</h3>
        <p>₹599</p>
        <button onclick="buy()">Buy Now</button>
    </div>

    <div class="card">
        <img src="photo-1434056886845-dac89ffe9b56.jpg" alt="">
        <h3>Omega Speedmaster</h3>
        <p>₹799</p>
        <button onclick="buy()">Buy Now</button>
    </div>

    <div class="card">
        <img src="photo-1523170335258-f5ed11844a49.jpg" alt="">
        <h3>Casio G-Shock</h3>
        <p>₹199</p>
        <button onclick="buy()">Buy Now</button>
    </div>

</section>

<!-- Footer -->

<footer>
    <p>&copy; 2026 WatchStore. All Rights Reserved.</p>
</footer>

<script>

let cart = 0;

function addToCart(){

    cart++;

    document.getElementById("cart-count").textContent = cart;

    alert("Watch added to cart!");

}

</script>

</body>
</html>
